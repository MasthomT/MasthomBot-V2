{# Style des labels (thème global + réglages propres à chaque label) réglé dans /admin/labels. Inclus avant </head>. #}
<style>html.lbl-wait { visibility: hidden; }</style>
<style id="lbl-style"></style>
<script>
(function () {
    // Nom du label = dernier segment de l'adresse (followers, viewers, subs, heure, follow, sub, subgift, bits, raid)
    var KEY = location.pathname.split('/').filter(Boolean).pop() || '';
    var HALLOWEEN_ICONS = {
        followers: 'fa-solid fa-ghost', viewers: 'fa-solid fa-eye', subs: 'fa-solid fa-skull', heure: 'fa-solid fa-moon',
        follow: 'fa-solid fa-ghost', sub: 'fa-solid fa-skull', subgift: 'fa-solid fa-hat-wizard',
        bits: 'fa-solid fa-gem', raid: 'fa-solid fa-spider'
    };
    // Zelda : cœur (followers), œil de vérité (viewers), rubis (subs), sablier (heure — Chant du Temps), bouclier hylien (raid)…
    var ZELDA_ICONS = {
        followers: 'fa-solid fa-heart', viewers: 'fa-solid fa-eye', subs: 'fa-solid fa-gem' /* remplacé par la triforce (SVG) */, heure: 'fa-solid fa-hourglass-half',
        follow: 'fa-solid fa-heart', sub: 'fa-solid fa-gem', subgift: 'fa-solid fa-gift',
        bits: 'fa-solid fa-coins', raid: 'fa-solid fa-shield-halved'
    };
    // Thème Zelda : vraies icônes dessinées en SVG (pas d'icône gratuite pour ça) — cœur, rubis vert / bleu / rouge, triforce,
    // œil de vérité, ocarina du Temps, Master Sword. Elles gardent leurs couleurs d'origine (le thème ne les recolore pas).
    var Z = function (inner, tilt, zoom) {
        return '<svg viewBox="0 0 100 100" width="1.08em" height="1.08em" style="display:block;overflow:visible;filter:drop-shadow(0 0 3px rgba(0,0,0,.55))" aria-hidden="true">'
            + (tilt ? '<g transform="translate(50 50) rotate(' + tilt + ') scale(' + (zoom || 1.18) + ') translate(-50 -50)">' + inner + '</g>' : inner) + '</svg>';
    };
    var rupee = function (main, light, dark) {
        return Z('<polygon points="50,3 80,24 80,76 50,97 20,76 20,24" fill="' + main + '" stroke="' + dark + '" stroke-width="5" stroke-linejoin="round"/>'
            + '<polygon points="50,3 20,24 20,76 50,97" fill="' + light + '" opacity=".55"/>'
            + '<polygon points="50,3 80,24 50,40 20,24" fill="#fff" opacity=".35"/>'
            + '<polyline points="20,24 50,40 80,24 M50,40 L50,97" fill="none" stroke="' + dark + '" stroke-width="3" opacity=".7"/>');
    };
    var ZELDA_SVG = {
        heart: function () {
            return Z('<path d="M50 91C20 67 5 50 5 31 5 16 17 7 30 7c8 0 15 4 20 12 5-8 12-12 20-12 13 0 25 9 25 24 0 19-15 36-45 60z" fill="#e8262b" stroke="#6b0f12" stroke-width="5" stroke-linejoin="round"/>'
                + '<ellipse cx="28" cy="27" rx="9" ry="6" transform="rotate(-35 28 27)" fill="#fff" opacity=".75"/>');
        },
        eye: function () {          // œil de vérité (Sheikah) : amande dorée, iris, larme
            return Z('<path d="M4 46Q50 4 96 46Q50 88 4 46Z" fill="#13203d" stroke="#f2c94c" stroke-width="6" stroke-linejoin="round"/>'
                + '<circle cx="50" cy="46" r="19" fill="#f2c94c"/><circle cx="50" cy="46" r="8" fill="#0b1220"/>'
                + '<circle cx="44" cy="40" r="3.5" fill="#fff" opacity=".85"/>'
                + '<path d="M50 74 L50 90 M50 90 q-6 6 0 9 q6-3 0-9z" fill="#f2c94c" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/>');
        },
        triforce: function (fill) {
            return Z('<g fill="' + fill + '" stroke="#7a5a08" stroke-width="3" stroke-linejoin="round"><polygon points="50,6 27.5,45 72.5,45"/>'
                + '<polygon points="27.5,48 5,87 50,87"/><polygon points="72.5,48 50,87 95,87"/></g>');
        },
        ocarina: function () {      // Ocarina du Temps : corps bleu-violet allongé, 7 trous, bec sur le dessus à gauche avec son anneau gris et sa triforce
            var hole = function (x, y, rx, ry, rot) {
                return '<ellipse cx="' + x + '" cy="' + y + '" rx="' + rx + '" ry="' + ry + '" transform="rotate(' + rot + ' ' + x + ' ' + y + ')" fill="#141a4a" stroke="#2c3170" stroke-width="5"/>';
            };
            return Z('<g transform="translate(0 6) scale(0.1988)">'
                // bec : court tube dessiné droit puis posé sur le bord du corps, perpendiculaire à lui (axe = vers le haut gauche)
                + '<g transform="translate(150 172) rotate(-47)">'
                + '<path d="M-42 0L-28 -84Q0 -108 28 -84L42 0Z" fill="#7f84d8" stroke="#2d3178" stroke-width="7" stroke-linejoin="round"/>'
                + '<ellipse cx="-13" cy="-66" rx="7" ry="17" fill="#fff" opacity=".35"/></g>'
                // corps
                + '<path d="M430 14C340 30 220 100 140 185 75 255 35 330 75 385 125 440 235 410 320 335 420 250 478 125 430 14Z" fill="#6d71cc" stroke="#2d3178" stroke-width="8" stroke-linejoin="round"/>'
                + '<path d="M405 36C335 70 235 135 165 215 110 280 85 340 105 372 145 408 225 372 295 312 375 240 440 130 405 36Z" fill="#8c90e4" opacity=".5"/>'
                // trous
                + hole(396, 66, 26, 21, -35) + hole(354, 114, 28, 23, -35) + hole(284, 136, 31, 25, -35)
                + hole(166, 284, 31, 27, -20) + hole(262, 268, 29, 26, -20) + hole(220, 354, 29, 25, -20) + hole(138, 372, 27, 25, -20)
                // anneau gris du bec + triforce (même repère que le bec : parfaitement dans son axe)
                + '<g transform="translate(150 172) rotate(-47)">'
                + '<rect x="-52" y="-24" width="104" height="48" rx="9" fill="#8d93a0" stroke="#3c4252" stroke-width="7"/>'
                + '<g fill="#f2c94c" stroke="#7a5a08" stroke-width="2.5" stroke-linejoin="round"><polygon points="0,-17 -9,-1 9,-1"/><polygon points="-10,1 -19,17 -1,17"/><polygon points="10,1 1,17 19,17"/></g></g>'
                + '</g>');
        },
        sword: function () {        // Master Sword : longue lame fine, garde bleue courte aux pointes relevées, poignée, pommeau doré
            return Z('<polygon points="46,9 54,9 55.5,63 44.5,63" fill="#e4edf7" stroke="#5f738a" stroke-width="2.5" stroke-linejoin="round"/>'
                + '<polygon points="46,9 50,0 54,9" fill="#e4edf7" stroke="#5f738a" stroke-width="2.5" stroke-linejoin="round"/>'
                + '<line x1="50" y1="12" x2="50" y2="60" stroke="#a9bdd1" stroke-width="2"/>'
                + '<path d="M31 59Q40 56 50 59Q60 56 69 59L66 68Q50 63 34 68Z" fill="#3b4fc4" stroke="#1a2468" stroke-width="2.5" stroke-linejoin="round"/>'
                + '<circle cx="50" cy="62" r="3.4" fill="#f2c94c" stroke="#7a5a08" stroke-width="1.3"/>'
                + '<rect x="46.5" y="67" width="7" height="16" rx="2" fill="#243b9a" stroke="#101a55" stroke-width="2"/>'
                + '<circle cx="50" cy="88" r="5" fill="#f2c94c" stroke="#7a5a08" stroke-width="2"/>', 45, 1.4);
        },
        navi: function () {         // Navi : boule de lumière bleue et ses deux ailes (« Hé ! Écoute ! » = nouveau follower)
            return Z('<path d="M43 50C30 38 12 40 5 22 22 17 40 28 47 44Z" fill="#fff" opacity=".85" stroke="#8fe3ff" stroke-width="2.5" stroke-linejoin="round"/>'
                + '<path d="M57 50C70 38 88 40 95 22 78 17 60 28 53 44Z" fill="#fff" opacity=".85" stroke="#8fe3ff" stroke-width="2.5" stroke-linejoin="round"/>'
                + '<circle cx="50" cy="56" r="27" fill="#7fd8ff" opacity=".28"/><circle cx="50" cy="56" r="20" fill="#a9ecff" opacity=".5"/>'
                + '<circle cx="50" cy="56" r="13" fill="#f2fcff" stroke="#8fe3ff" stroke-width="2"/>');
        },
        green: function () { return rupee('#2ec94a', '#9bf5a8', '#0e6a22'); },
        blue: function () { return rupee('#2f7bff', '#a9caff', '#102f96'); },
        red: function () { return rupee('#ff3b3b', '#ffb4b4', '#8f1010'); }
    };
    // quelle icône pour quel label (cœur = nombre de followers, Navi = dernier follow, rubis vert = sub, bleu = subgift, rouge = bits, triforce = nombre d'abonnés…)
    var ZELDA_SVG_FOR = { followers: 'heart', follow: 'navi', viewers: 'eye', subs: 'triforce', heure: 'ocarina',
                          sub: 'green', subgift: 'blue', bits: 'red', raid: 'sword' };
    var root = document.documentElement;
    root.classList.add('lbl-wait');                       // évite d'afficher l'ancien style une fraction de seconde
    setTimeout(function () { root.classList.remove('lbl-wait'); }, 1500);

    var styleEl = document.getElementById('lbl-style');
    var fontLink = null, lastSig = null, origIcon = null, origLogoHtml = null;

    var KEYFRAMES =
        '@keyframes lbl-pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}' +
        '@keyframes lbl-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}' +
        '@keyframes lbl-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}' +
        '@keyframes lbl-shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}';
    var ANIMS = { pulse: 'lbl-pulse 1.5s ease-in-out infinite', spin: 'lbl-spin 3s linear infinite',
                  bounce: 'lbl-bounce 1s ease-in-out infinite', shake: 'lbl-shake .6s ease-in-out infinite', none: 'none' };

    // Polices hors Google Fonts : utilisées si elles sont installées sur le PC d'OBS, sinon la police proche (Charlemagne → Metamorphous)
    var LOCAL_FONTS = { 'Charlemagne Std': 'Metamorphous', 'Charlemagne': 'Metamorphous' };
    function loadFont(name) {
        if (fontLink) { fontLink.remove(); fontLink = null; }
        if (!name) return;
        if (LOCAL_FONTS[name]) name = LOCAL_FONTS[name];
        // avec les graisses 400 et 700 (gras net) ; polices à une seule graisse : on redemande sans
        var fam = encodeURIComponent(name).replace(/%20/g, '+');
        var add = function (spec) {
            var l = document.createElement('link'); l.rel = 'stylesheet';
            l.href = 'https://fonts.googleapis.com/css2?family=' + fam + spec + '&display=swap';
            document.head.appendChild(l); return l;
        };
        fontLink = add(':wght@400;700');
        fontLink.onerror = function () { fontLink = add(''); };
    }

    // Réglages effectifs : thème global, puis réglages propres à ce label (un champ vide ne change rien)
    function effective(s) {
        var e = {}, k;
        for (k in s) if (k !== 'labels') e[k] = s[k];
        var own = (s.labels && s.labels[KEY]) || {};
        for (k in own) if (own[k] !== '' && own[k] != null) e[k] = own[k];
        return e;
    }

    function gradient(angle, colors) {
        var c = colors.filter(function (x) { return x; });
        if (c.length < 2) return '';
        return 'linear-gradient(' + (angle === '' || angle == null ? 90 : parseInt(angle, 10)) + 'deg,' + c.join(',') + ')';
    }

    // Le script est dans <head> : le <body> (et donc l'icône) n'existe pas encore au premier appel
    function whenReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
    }

    function apply(raw) {
        var sig = JSON.stringify(raw);
        if (sig === lastSig) return;
        lastSig = sig;
        var s = effective(raw);

        var body = [], text = [], logo = [], logoI = [];
        if (s.font)   body.push("font-family:'" + s.font.replace(/'/g, '') + "'," + (LOCAL_FONTS[s.font] ? "'" + LOCAL_FONTS[s.font] + "'," : '') + "'Montserrat',sans-serif !important");
        if (s.weight) body.push('font-weight:' + s.weight + ' !important');
        if (s.size)   body.push('font-size:' + parseInt(s.size, 10) + 'px !important');
        if (s.spacing !== '' && s.spacing != null) text.push('letter-spacing:' + parseFloat(s.spacing) + 'px !important');
        if (s.uppercase) text.push('text-transform:uppercase !important');

        // Texte : dégradé ou couleur unie
        var tg = s.text_mode === 'gradient' ? gradient(s.grad_angle, [s.grad1, s.grad2, s.grad3]) : '';
        if (tg) {
            // text-shadow ne marche pas avec un texte dégradé : la lueur passe par drop-shadow
            text.push('background:' + tg + ' !important', '-webkit-background-clip:text !important',
                      'background-clip:text !important', '-webkit-text-fill-color:transparent !important',
                      'color:transparent !important', 'text-shadow:none !important');
            if (s.glow) text.push('filter:drop-shadow(0 0 6px ' + s.glow + ') drop-shadow(0 0 14px ' + s.glow + ') !important');
        } else {
            if (s.color) body.push('color:' + s.color + ' !important');
            if (s.glow) {
                var shadow = '0 0 6px ' + s.glow + ',0 0 16px ' + s.glow + ',2px 2px 4px rgba(0,0,0,.85)';
                body.push('text-shadow:' + shadow + ' !important');
                text.push('text-shadow:' + shadow + ' !important');
            }
        }

        // Icône : couleur / dégradé / animation / masquée
        var ig = s.icon_mode === 'gradient' ? gradient(s.icon_grad_angle, [s.icon_grad1, s.icon_grad2]) : '';
        if (ig) {
            logoI.push('background:' + ig + ' !important', '-webkit-background-clip:text !important',
                       'background-clip:text !important', '-webkit-text-fill-color:transparent !important',
                       'color:transparent !important', 'text-shadow:none !important', 'display:inline-block !important');
            if (s.glow) logo.push('filter:drop-shadow(0 0 6px ' + s.glow + ') !important');
        } else if (s.icon_color) {
            logo.push('color:' + s.icon_color + ' !important');
        }
        if (s.icon_anim && ANIMS[s.icon_anim]) logo.push('animation:' + ANIMS[s.icon_anim] + ' !important', 'display:inline-block !important');
        if (s.icon_hidden) logo.push('display:none !important');

        styleEl.textContent = KEYFRAMES +
            'body{' + body.join(';') + '}' +
            '#chiffre,#horloge,#text-container,.cursor{' + text.join(';') + '}' +
            '.logo{' + logo.join(';') + '}' +
            '.logo i,.logo span{' + logoI.join(';') + '}';

        loadFont(s.font);

        // Icône affichée : classe FontAwesome (réglage du label, ou jeu Halloween, ou celle de la page) ou texte / emoji
        var logoEl = document.querySelector('.logo');
        var icon = document.querySelector('.logo i');
        if (logoEl) {
            if (origLogoHtml === null) origLogoHtml = logoEl.innerHTML;
            if (icon && origIcon === null) origIcon = icon.className;
            if (s.icon_text) {
                logoEl.innerHTML = '<span style="font-style:normal">' + s.icon_text.replace(/</g, '&lt;') + '</span>';
            } else if (s.icon_set === 'zelda' && ZELDA_SVG_FOR[KEY] && !s.icon) {
                logoEl.innerHTML = ZELDA_SVG[ZELDA_SVG_FOR[KEY]](s.icon_color || '#f2c94c');
            } else {
                if (logoEl.innerHTML !== origLogoHtml) logoEl.innerHTML = origLogoHtml;
                icon = document.querySelector('.logo i');
                if (icon) {
                    icon.className = s.icon ? s.icon
                        : ((s.icon_set === 'halloween' && HALLOWEEN_ICONS[KEY]) ? HALLOWEEN_ICONS[KEY]
                        : (s.icon_set === 'zelda' && ZELDA_ICONS[KEY]) ? ZELDA_ICONS[KEY] : origIcon);
                }
            }
        }
        root.classList.remove('lbl-wait');
    }

    // Aperçu depuis l'admin : ?preview=<style encodé en base64> (pas de relecture du serveur)
    var preview = new URLSearchParams(location.search).get('preview');
    if (preview) {
        try {
            var pv = JSON.parse(decodeURIComponent(escape(atob(preview))));
            whenReady(function () { apply(pv); });
        } catch (e) { root.classList.remove('lbl-wait'); }
        return;
    }

    function refresh() {
        fetch('/api/labels/style?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (st) { whenReady(function () { apply(st); }); })
            .catch(function () { root.classList.remove('lbl-wait'); });
    }
    refresh();
    setInterval(refresh, 15000);                          // un changement d'admin est repris sans recharger OBS
    document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
})();
</script>
