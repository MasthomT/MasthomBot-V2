<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: transparent;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
}

/* Pas de cadre nulle part : tout est du texte flottant avec une lueur, pas de panneau/boîte. */
.glow-text {
  text-shadow:
    -1.5px -1.5px 0 rgba(0,0,0,0.55), 1.5px -1.5px 0 rgba(0,0,0,0.55),
    -1.5px  1.5px 0 rgba(0,0,0,0.55), 1.5px  1.5px 0 rgba(0,0,0,0.55),
    0 0 18px rgba(145,70,255,0.75);
}

/* ── Statut permanent : haut droite, compact, texte flottant, pas de panneau ── */
#status {
  position: fixed;
  top: 55px; right: 24px;
  text-align: right;
  animation: float-y 4s ease-in-out infinite, status-glow 2.6s ease-in-out infinite;
}
@keyframes float-y {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-4px); }
}
@keyframes status-glow {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.2); }
}

#s-title {
  font-size: 11px; font-weight: 900;
  text-transform: uppercase; letter-spacing: 2px;
  color: #c4b5fd;
}
#s-countdown {
  margin-left: 6px;
  font-size: 10.5px; font-weight: 700;
  color: #fbbf24;
}
#s-countdown.urgent { color: #f87171; animation: blink-r 1s ease infinite; }
@keyframes blink-r { 50% { opacity:.4; } }

#s-break { font-size: 10.5px; color: #e9d5ff; opacity: 0.8; font-weight: 700; margin-top: 2px; }

#s-next {
  margin-top: 6px;
  font-size: 13px; font-weight: 800; color: #fde68a;
  max-width: 380px;
}

/* Barre de progression : piste visible pour qu'on comprenne où est le "plein", pas juste
   un dégradé flottant sans repère. */
#s-meta {
  font-size: 12px; font-weight: 800; color: #fff;
  margin-top: 6px;
}
#s-meta.pop { animation: pop-total .35s cubic-bezier(0.34,1.7,0.64,1) forwards; }
@keyframes pop-total { 0% { transform: scale(1); } 45% { transform: scale(1.25) rotate(-2deg); } 100% { transform: scale(1); } }
#s-meta .max { color: rgba(255,255,255,0.5); font-weight: 700; }
#s-bar-track {
  margin-top: 4px;
  margin-left: auto;
  width: 300px; height: 6px;
  background: rgba(255,255,255,0.14);
  border-radius: 4px;
  overflow: hidden;
}
#s-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #7c3aed, #ec4899, #fbbf24);
  border-radius: 4px;
  box-shadow: 0 0 10px rgba(236,72,153,0.7);
  transition: width 1.2s cubic-bezier(.25,1,.5,1);
}

#s-pills { margin-top: 8px; font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.3); max-width: 380px; }
#s-pills .p-done  { color: rgba(255,255,255,0.25); text-decoration: line-through; }
#s-pills .p-active{ color: #fde68a; animation: pill-pulse 1.1s ease-in-out infinite; }
@keyframes pill-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
#s-pills .p-sep { opacity: 0.3; margin: 0 2px; }

/* ── Alerte à chaque sub : texte volant, pas de cadre ── */
#sub-alert {
  position: fixed;
  top: 12%; left: 50%;
  transform: translate(-50%, -30px) scale(0.6);
  opacity: 0;
  text-align: center;
  pointer-events: none;
  transition: opacity .3s ease, transform .5s cubic-bezier(0.34,1.7,0.5,1);
}
#sub-alert.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
#sa-icon { font-size: 40px; display: block; animation: sa-spin 1.2s ease-in-out; }
@keyframes sa-spin { 0% { transform: rotate(0); } 50% { transform: rotate(15deg) scale(1.2); } 100% { transform: rotate(0); } }
#sa-text { font-size: 28px; font-weight: 900; color: #fff; margin-top: 4px; }
#sa-text b { color: #fde68a; font-size: 1.25em; }
#sa-sub { font-size: 13px; font-weight: 700; color: #c4b5fd; margin-top: 2px; }

/* ── Confettis (paliers ET alertes de sub) ── */
#confetti-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 998; }
.confetto {
  position: absolute; top: -20px;
  width: 10px; height: 16px;
  opacity: 0.95;
  animation: confetti-fall linear forwards;
}
@keyframes confetti-fall {
  0%   { transform: translateY(0) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(720deg); }
}

/* ── Célébration palier débloqué : plein écran, texte flottant géant, pas de cadre ── */
#celebrate {
  position: fixed; inset: 0;
  pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity .4s ease;
  z-index: 1000;
}
#celebrate.show { opacity: 1; }
.cele-inner {
  text-align: center;
  transform: scale(0.5) rotate(-4deg);
  transition: transform .6s cubic-bezier(0.34,1.7,0.5,1);
}
#celebrate.show .cele-inner { transform: scale(1) rotate(0deg); animation: cele-bounce 1.8s ease-in-out .6s infinite; }
@keyframes cele-bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-10px) scale(1.03); } }
.cele-tag { font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 4px; color: #fbbf24; margin-bottom: 8px; }
.cele-n { font-size: 68px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 8px; }
.cele-label { font-size: 26px; font-weight: 800; color: #e9d5ff; max-width: 700px; }

/* ── !subgoal / !subtember : SEULEMENT un texte d'accroche au centre + confettis/étincelles,
   rien d'autre (pas de détail, c'est le chat qui donne l'info) ── */
#command-alert {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.4) rotate(-6deg);
  opacity: 0;
  text-align: center;
  pointer-events: none;
  transition: opacity .3s ease, transform .55s cubic-bezier(0.34,1.7,0.5,1);
  z-index: 999;
}
#command-alert.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1) rotate(0deg);
  animation: cc-pulse 1.4s ease-in-out .55s infinite;
}
@keyframes cc-pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.35); } }
.cc-title {
  font-size: 46px; font-weight: 900;
  text-transform: uppercase; letter-spacing: 3px;
  color: #c7d2fe;
}
.cc-title .accent {
  color: #fbbf24;
  text-shadow:
    -1.5px -1.5px 0 rgba(0,0,0,0.55), 1.5px -1.5px 0 rgba(0,0,0,0.55),
    -1.5px  1.5px 0 rgba(0,0,0,0.55), 1.5px  1.5px 0 rgba(0,0,0,0.55),
    0 0 22px rgba(251,191,36,0.85);
}

.spark {
  position: absolute; font-size: 15px; color: #fbbf24;
  pointer-events: none;
  animation: spark-burst .8s ease-out forwards;
}
@keyframes spark-burst {
  0%   { transform: translate(0, 0) scale(0.4) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(180deg); opacity: 0; }
}
</style>
</head>
<body>

<!-- Statut permanent -->
<div id="status" class="glow-text">
  <span id="s-title">🎯 SubGoal</span><span id="s-countdown"></span>
  <div id="s-break"></div>
  <div id="s-next">Chargement…</div>
  <div id="s-meta"></div>
  <div id="s-bar-track"><div id="s-bar"></div></div>
  <div id="s-pills"></div>
</div>

<!-- Alerte à chaque sub -->
<div id="sub-alert" class="glow-text">
  <span id="sa-icon">🎉</span>
  <div id="sa-text"></div>
  <div id="sa-sub"></div>
</div>

<div id="confetti-layer"></div>

<!-- Célébration palier débloqué -->
<div id="celebrate">
  <div class="cele-inner glow-text">
    <div class="cele-tag">Palier débloqué</div>
    <div class="cele-n" id="cele-n"></div>
    <div class="cele-label" id="cele-label"></div>
  </div>
</div>

<!-- !subgoal / !subtember : juste un texte d'accroche, rien d'autre -->
<div id="command-alert" class="glow-text">
  <div class="cc-title" id="cc-title"></div>
</div>

<script>
let prevTotal = -1;
let endDate = null;

function idx(tiers, total) { for(let i=0;i<tiers.length;i++) if(total<tiers[i].threshold) return i; return tiers.length; }

function tickCountdown() {
  const el = document.getElementById('s-countdown');
  if (!endDate) { el.textContent = ''; el.classList.remove('urgent'); return; }
  const end = new Date(endDate + 'T23:59:59');
  const diff = end - Date.now();
  if (diff <= 0) { el.textContent = '⏰ Terminé'; el.classList.remove('urgent'); return; }
  const days = Math.floor(diff / 86_400_000);
  const hours = Math.floor((diff % 86_400_000) / 3_600_000);
  el.textContent = days > 0 ? ` ⏳ J-${days}` : ` ⏳ ${hours}h`;
  el.classList.toggle('urgent', diff < 3_600_000 * 6);
}

function render(d) {
  const tiers = (d.tiers || []).slice().sort((a, b) => a.threshold - b.threshold);
  // 1 point = 1 sub ou 1 subgift, peu importe l'origine — on ignore les bits pour l'objectif.
  const total = d.total_subs || 0;
  endDate = d.end_date || null;
  tickCountdown();

  const totalChanged = total !== prevTotal;
  document.getElementById('s-break').textContent = `${d.subs || 0} subs · ${d.subgifts || 0} gifts`;

  if (tiers.length === 0) {
    document.getElementById('s-next').textContent = 'Aucun palier configuré';
    document.getElementById('s-bar').style.width = '0%';
    document.getElementById('s-meta').textContent = '';
    document.getElementById('s-pills').innerHTML = '';
    prevTotal = total;
    return;
  }

  const i = idx(tiers, total);

  if (i < tiers.length) {
    const cur  = tiers[i];
    const from = i > 0 ? tiers[i-1].threshold : 0;
    const pct  = from===cur.threshold ? 100 : Math.min(100,((total-from)/(cur.threshold-from))*100);
    document.getElementById('s-next').textContent = `→ ${cur.threshold} subs : ${cur.label}`;
    document.getElementById('s-bar').style.width = pct.toFixed(1)+'%';
    const metaEl = document.getElementById('s-meta');
    metaEl.innerHTML = `${total} <span class="max">/ ${cur.threshold} subs</span>`;
    if (totalChanged) { metaEl.classList.remove('pop'); void metaEl.offsetWidth; metaEl.classList.add('pop'); }
  } else {
    document.getElementById('s-next').textContent = '🎉 Tous les paliers débloqués !';
    document.getElementById('s-bar').style.width = '100%';
    document.getElementById('s-meta').textContent = '';
  }

  const pillsEl = document.getElementById('s-pills');
  pillsEl.innerHTML = tiers.map((t, j) => {
    const done = total >= t.threshold, active = j === i;
    const cls = done ? 'p-done' : active ? 'p-active' : '';
    return `<span class="${cls}">${t.threshold}</span>`;
  }).join('<span class="p-sep">→</span>');

  prevTotal = total;
}

async function poll() {
  try {
    const r = await fetch('/api/v1/subgoal');
    if (r.ok) render(await r.json());
  } catch(e) {}
}

// ── Confettis partagés (paliers + alertes de sub) ─────────────────────────────────────
const CONFETTI_COLORS = ['#9146ff', '#fbbf24', '#f472b6', '#60a5fa', '#34d399', '#f87171'];
function spawnConfetti(n) {
  const layer = document.getElementById('confetti-layer');
  for (let k = 0; k < n; k++) {
    const c = document.createElement('div');
    c.className = 'confetto';
    c.style.left = (Math.random() * 100) + 'vw';
    c.style.background = CONFETTI_COLORS[k % CONFETTI_COLORS.length];
    c.style.animationDuration = (2.2 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    layer.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function spawnSparks(container, count) {
  container.querySelectorAll('.spark').forEach(s => s.remove());
  for (let n = 0; n < count; n++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = n % 2 === 0 ? '✦' : '✨';
    s.style.top = '50%'; s.style.left = '50%';
    const angle = (n / count) * 360 + Math.random() * 20;
    const dist = 60 + Math.random() * 70;
    s.style.setProperty('--dx', (Math.cos(angle * Math.PI / 180) * dist) + 'px');
    s.style.setProperty('--dy', (Math.sin(angle * Math.PI / 180) * dist) + 'px');
    s.style.animationDelay = (Math.random() * 0.15) + 's';
    container.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

// ── Alerte à CHAQUE sub / subgift — donne envie aux autres de participer ──────────────
let subAlertTimer = null;
let subAlertQueue = [];
let subAlertPlaying = false;

function playNextSubAlert() {
  if (subAlertPlaying || subAlertQueue.length === 0) return;
  subAlertPlaying = true;
  const data = subAlertQueue.shift();

  const el = document.getElementById('sub-alert');
  const isGift = data.kind === 'subgift';
  document.getElementById('sa-icon').textContent = isGift ? '🎁' : '🎉';
  document.getElementById('sa-text').innerHTML = isGift
    ? `<b>${data.username}</b> offre ${data.count > 1 ? data.count + ' subs' : '1 sub'} !`
    : `<b>${data.username}</b> vient de s'abonner !`;
  document.getElementById('sa-sub').textContent = 'Toi aussi, tape !subgoal 👀';

  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  spawnSparks(el, 8);
  spawnConfetti(20);

  clearTimeout(subAlertTimer);
  subAlertTimer = setTimeout(() => {
    el.classList.remove('show');
    subAlertPlaying = false;
    playNextSubAlert();
  }, 3200);
}

function triggerSubAlert(data) {
  subAlertQueue.push(data);
  playNextSubAlert();
}

// ── Célébration palier débloqué ─────────────────────────────────────────────────────
let celebrateTimer = null;
function triggerCelebration(data) {
  document.getElementById('cele-n').innerHTML = `${data.threshold}<span style="font-size:28px;opacity:.5"> subs</span>`;
  document.getElementById('cele-label').textContent = data.label || '';
  spawnConfetti(60);
  const el = document.getElementById('celebrate');
  el.classList.add('show');
  clearTimeout(celebrateTimer);
  celebrateTimer = setTimeout(() => el.classList.remove('show'), 5000);
  poll();
}

// ── !subgoal / !subtember : SEULEMENT un texte d'accroche + confettis/étincelles ─────
let commandTimer = null;
function triggerCommandCard(data) {
  const titleEl = document.getElementById('cc-title');
  titleEl.innerHTML = '🌙 ATTENTION <span class="accent">SUBTEMBER</span> 🐈‍⬛';

  const el = document.getElementById('command-alert');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  spawnSparks(el, 14);
  spawnConfetti(35);
  clearTimeout(commandTimer);
  commandTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function handleAlert(data) {
  if (data.type === 'subgoal_tier_unlocked') triggerCelebration(data);
  if (data.type === 'subgoal_command') triggerCommandCard(data);
  if (data.type === 'subgoal_new_sub') triggerSubAlert(data);
}

// 📡 UNE seule connexion SSE partagée entre TOUTES les sources OBS de cette origine (via
// SharedWorker), au lieu d'une connexion par overlay — même mécanisme que les autres
// overlays temps réel de ce projet (roue, labels).
if (typeof SharedWorker !== 'undefined') {
  try {
    const worker = new SharedWorker('/api/labels/worker.js');
    worker.port.onmessage = (e) => {
      const enveloppe = JSON.parse(e.data);
      if (enveloppe.channel === 'alerts') handleAlert(enveloppe.data);
    };
    worker.port.start();
  } catch (e) { console.error('SharedWorker indisponible :', e); }
}

poll();
setInterval(poll, 30000);
setInterval(tickCountdown, 60000);
</script>
</body>
</html>
