<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: transparent; }
        .emote {
            position: absolute;
            bottom: -150px;
            animation: rise linear forwards;
            will-change: transform;
        }
        @keyframes rise {
            from { transform: translateY(0) rotate(0deg); opacity: 1; }
            to { transform: translateY(-120vh) rotate(360deg); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div id="wall"></div>
<script>
    // Détecte automatiquement l'IP du Raspberry Pi (192.168.1.109)
    const ip = window.location.hostname;
    const wall = document.getElementById('wall');

    function handleEvent(data) {
        if (data.type === 'emote_rain') {
            data.details.urls.forEach((url, index) => {
                setTimeout(() => {
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'emote';
                    img.style.left = (Math.random() * 90) + "vw";
                    img.style.width = (Math.random() * 60 + 100) + "px";
                    img.style.animationDuration = (Math.random() * 2 + 2) + "s";

                    document.body.appendChild(img);
                    setTimeout(() => img.remove(), 4000);
                }, index * 50);
            });
        }
    }

    // 📡 UNE seule connexion SSE partagée entre TOUTES les sources OBS du serveur
    // régie (port 3005), via SharedWorker cross-origin, au lieu d'une connexion par overlay.
    if (typeof SharedWorker !== 'undefined') {
        try {
            const worker = new SharedWorker(`http://${ip}:3005/worker.js`);
            worker.port.onmessage = (e) => handleEvent(JSON.parse(e.data));
            worker.port.start();
        } catch (e) {
            console.error('SharedWorker indisponible, repli EventSource direct :', e);
            new EventSource(`http://${ip}:3005/events`).onmessage = (e) => handleEvent(JSON.parse(e.data));
        }
    } else {
        new EventSource(`http://${ip}:3005/events`).onmessage = (e) => handleEvent(JSON.parse(e.data));
    }
</script>
</body>
</html>
