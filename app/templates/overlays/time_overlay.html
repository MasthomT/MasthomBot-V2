<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --hue-speed: 60s; } 
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: transparent; 
            font-family: 'Kanit', sans-serif; 
        }

        #timer-container {
            position: absolute;
            top: 15px; left: 0; width: 100vw;
            display: flex; justify-content: center;
            align-items: flex-start; gap: 10px;
        }

        .timer-widget {
            padding: 8px 20px; 
            background: rgba(10, 10, 15, 0.4);
            backdrop-filter: blur(8px);
            border-left: 4px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            text-align: center;
            min-width: 180px;
            border-radius: 6px;
        }

        .label {
            font-size: 1.2rem; font-weight: 700; text-transform: uppercase;
            color: white; letter-spacing: 2px; display: block;
            margin-bottom: 0px; opacity: 0.9;
        }

        .display {
            font-size: 2.8rem; font-weight: 900; margin: 0; line-height: 1;
            color: #00f2ff; 
            animation: spectrum-cycle var(--hue-speed) linear infinite;
        }

        @keyframes spectrum-cycle {
            from { filter: hue-rotate(0deg) drop-shadow(0 0 8px rgba(0, 242, 255, 0.3)); }
            to { filter: hue-rotate(360deg) drop-shadow(0 0 8px rgba(0, 242, 255, 0.3)); }
        }
        /* chrono en pause : les chiffres clignotent doucement */
        .timer-widget.paused .display { animation: chronoPause 1.2s ease-in-out infinite; }
        @keyframes chronoPause { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
    <script>(function(){var s=document.createElement('script');s.src='/static/theme.js?t='+Date.now();document.head.appendChild(s);})();</script>
</head>
<body>
    <div id="timer-container"></div>
    <script>
        const ip = window.location.hostname;
        const container = document.getElementById('timer-container');

        function handleEvent(data) {
            if (data.type === 'time_event') {
                const d = data.details;
                if (d.action === 'reset' || d.action === 'stop') {
                    container.innerHTML = '';
                }
                else if (d.action === 'start') {
                    createTimer(d);
                }
                else if (d.action === 'pause') {
                    timers.forEach(tm => tm.pause());
                }
                else if (d.action === 'resume' || d.action === 'play') {
                    timers.forEach(tm => tm.resume());
                }
            }
        }

        // 📡 UNE seule connexion SSE partagée entre TOUTES les sources OBS du serveur
        // régie (port 3005), via SharedWorker cross-origin, au lieu d'une connexion par overlay.
        if (typeof SharedWorker !== 'undefined') {
            try {
                const worker = new SharedWorker(`http://${ip}:3005/worker.js`);
                worker.port.onmessage = (e) => handleEvent(JSON.parse(e.data));
                worker.port.start();
            } catch (e) {
                console.error('SharedWorker indisponible, repli EventSource direct :', e);
                new EventSource(`http://${ip}:3005/events`).onmessage = (e) => handleEvent(JSON.parse(e.data));
            }
        } else {
            new EventSource(`http://${ip}:3005/events`).onmessage = (e) => handleEvent(JSON.parse(e.data));
        }

        // chronos/minuteurs affichés : chacun cumule son temps écoulé (pause / reprise)
        const timers = [];

        function createTimer(config) {
            const widget = document.createElement('div');
            widget.className = 'timer-widget next-anim';
            
            const labelEl = document.createElement('span');
            labelEl.className = 'label';
            labelEl.innerText = config.label || "OBJECTIF";

            const displayEl = document.createElement('div');
            displayEl.className = 'display';
            displayEl.innerText = "00:00";

            widget.appendChild(labelEl);
            widget.appendChild(displayEl);
            container.appendChild(widget);

            let startTime = Date.now();
            let elapsedBefore = 0;          // ms accumulées avant la dernière reprise
            let paused = false;
            const state = {
                pause() {
                    if (paused) return;
                    elapsedBefore += Date.now() - startTime;
                    paused = true;
                    widget.classList.add('paused');
                },
                resume() {
                    if (!paused) return;
                    startTime = Date.now();
                    paused = false;
                    widget.classList.remove('paused');
                },
            };
            timers.push(state);

            const interval = setInterval(() => {
                if (!widget.isConnected) {          // effacé par !chrono stop
                    clearInterval(interval);
                    timers.splice(timers.indexOf(state), 1);
                    return;
                }
                const elapsedMs = elapsedBefore + (paused ? 0 : Date.now() - startTime);
                const diff = Math.floor(elapsedMs / 1000);
                let t = config.mode === 'chrono' ? diff : config.duration - diff;

                if (t <= 0 && config.mode === 'timer') {
                    t = 0;
                    clearInterval(interval);
                    displayEl.style.color = "#ff4b2b";
                    setTimeout(() => {
                        widget.style.opacity = '0';
                        widget.style.transition = 'opacity 1s';
                        setTimeout(() => widget.remove(), 1000);
                    }, 5000);
                }

                const m = Math.floor(Math.abs(t) / 60);
                const s = Math.abs(t) % 60;
                displayEl.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            }, 250);
        }
    </script>
</body>
</html>
