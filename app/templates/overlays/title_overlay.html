<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Écran de titre</title>
<style>
  :root { --accent: #ff7a18; --base: #4682b4; --outline: #f0f8ff; --font: 'Kanit', sans-serif; --hue-speed: 40s; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; perspective: 1000px; }
  #backdrop, #fx { position: fixed; inset: 0; pointer-events: none; }
  #fx { overflow: hidden; }
  #screen { position: fixed; inset: 0; }
  /* cadre en marge de l'écran, avec une aura qui déborde vers l'intérieur */
  #frame { position: fixed; inset: 0; pointer-events: none; display: none; box-sizing: border-box;
           border: .18vw solid var(--frame); box-shadow: inset 0 0 .8vw .1vw var(--frame), inset 0 0 3vw .2vw var(--frame-a), inset 0 0 8vw var(--frame-b); }
  .has-frame #frame { display: block; }
  .blk { position: absolute; transform: translate(-50%, -50%) scale(var(--k, 1)); display: flex; flex-direction: column; align-items: center;
         text-align: center; font-family: var(--font); transform-style: preserve-3d; }
  .blk .in { animation-fill-mode: both; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .logo { position: absolute; transform: translate(-50%, -50%) scale(var(--k, 1)); }
  .logo img { display: block; width: 100%; height: auto; }

  /* ── formats de ligne (reprennent la décoration de l'ancienne page overlay_scenes.html) ── */
  .ln { white-space: normal; max-width: 100%; }
  .ln .em { color: var(--accent); -webkit-text-fill-color: var(--accent); text-shadow: 0 0 .4em var(--accent); -webkit-text-stroke: 0; }
  .l-main { font-weight: 900; line-height: .9; letter-spacing: 1px; color: transparent;
            -webkit-text-stroke: 1.5px var(--outline); text-shadow: 0 0 1px var(--base);
            background-image: linear-gradient(to bottom, var(--base), var(--base));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hue .l-main { animation: hue-rotate var(--hue-speed) linear infinite; }
  .l-sub { font-weight: 700; line-height: .9; color: transparent; -webkit-text-stroke: 1px var(--outline);
           filter: drop-shadow(0 0 5px rgba(240,248,255,.5)); animation: pulse-light 8s infinite alternate ease-in-out; }
  .l-message { font-weight: 300; letter-spacing: 5px; color: var(--outline); text-shadow: 0 0 5px rgba(240,248,255,.5);
               opacity: 0; animation: fadeIn 2s 1s forwards; }
  .l-plain { font-weight: 700; color: var(--outline); text-shadow: 0 0 10px rgba(240,248,255,.6); }
  .look-theme .l-main { filter: drop-shadow(0 0 .35vw var(--base)) drop-shadow(0 0 1vw var(--base)); }
  .look-theme .l-sub { filter: drop-shadow(0 0 .3vw var(--accent)); }
  .cd-label { font-weight: 300; letter-spacing: 5px; color: var(--outline); text-transform: uppercase; opacity: .9; margin-bottom: .3em; }
  .cd-num { font-weight: 900; color: var(--outline); letter-spacing: 4px; font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(240,248,255,.8), 0 0 20px var(--base); animation: pulse-light 8s infinite alternate ease-in-out; }
  .look-theme .cd-num { text-shadow: 0 0 .5vw var(--accent), 0 0 1.4vw var(--accent); }

  /* ── habillage Halloween : actif seulement tant que le thème Halloween l'est (retour auto au style classique après la date de fin).
        Tailles, graisses et hiérarchie des lignes ne changent pas : seuls la police, les couleurs, les contours et les lueurs changent (aucun élément ajouté). ── */
  .hw .l-main { -webkit-text-stroke: .16vw #1b0630; text-shadow: none; letter-spacing: 3px;
                background-image: linear-gradient(to bottom, #ffd27a 0%, var(--hw1) 42%, #c2410c 72%, var(--hw2) 100%);
                filter: drop-shadow(0 0 .35vw var(--hw1)) drop-shadow(0 .25vw 0 #1b0630) drop-shadow(0 0 1.3vw var(--hw2));
                animation: none; }
  .hw.hue .l-main { animation: none; }
  .hw .l-sub { -webkit-text-stroke: .1vw var(--hw1); filter: drop-shadow(0 0 .35vw var(--hw2)) drop-shadow(0 0 .9vw var(--hw2)); animation: none; letter-spacing: 2px; }
  .hw .l-message { color: #efe3c8; text-shadow: 0 0 .5vw var(--hw1), 0 .1vw .2vw #000; }
  .hw .l-plain { color: #efe3c8; text-shadow: 0 0 .6vw var(--hw1), 0 .1vw .2vw #000; }
  .hw .cd-label { color: #efe3c8; text-shadow: 0 0 .4vw var(--hw1); }
  .hw .cd-num { color: var(--hw1); text-shadow: 0 0 .5vw var(--hw1), 0 0 1.4vw var(--hw2), 0 .15vw 0 #1b0630; }
  .hw .ln .em { color: var(--hw1); -webkit-text-fill-color: var(--hw1); text-shadow: 0 0 .5vw var(--hw1); }

  .noglow .l-sub { filter: none !important; }
  .noglow .l-message, .noglow .l-plain, .noglow .cd-num, .noglow .ln .em { text-shadow: none !important; }
  .noglow.look-theme .l-main { filter: none !important; }
  .lw { display: flex; flex-direction: column; align-items: center; width: 100%; }

  @keyframes hue-rotate { 0% { filter: hue-rotate(0deg) } 100% { filter: hue-rotate(360deg) } }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes pulse-light { 0% { opacity: .9 } 100% { opacity: 1 } }
  @keyframes ridge { 0% { transform: rotateX(0deg) translateY(0) } 100% { transform: rotateX(.5deg) translateY(-5px) } }
  .ridge { transform-style: preserve-3d; animation: ridge 15s infinite alternate ease-in-out; }

  @keyframes in-perspective { 0% { transform: translateZ(500px); opacity: 0 } 100% { transform: translateZ(0); opacity: 1 } }
  @keyframes in-fade   { from { opacity: 0 } to { opacity: 1 } }
  @keyframes in-zoom   { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: scale(1) } }
  @keyframes in-bounce { 0% { opacity: 0; transform: scale(.3) } 55% { opacity: 1; transform: scale(1.18) } 75% { transform: scale(.95) } 100% { transform: scale(1) } }
  @keyframes in-slide-up { from { opacity: 0; transform: translateY(30vh) } to { opacity: 1; transform: none } }

  .fx-i { position: absolute; line-height: 1; opacity: 0; }
  .rise { bottom: -12vh; animation: rise var(--d) ease-in forwards; }
  @keyframes rise { 0% { opacity: 0; transform: translate(0,0) scale(.6) rotate(-10deg) } 10% { opacity: 1 }
                    50% { transform: translate(var(--dx), -60vh) scale(1) rotate(12deg) } 100% { opacity: 0; transform: translate(calc(var(--dx)*2), -125vh) scale(1.2) rotate(-10deg) } }
  .fall { top: -10vh; animation: fall var(--d) linear forwards; }
  @keyframes fall { 0% { opacity: 0; transform: translateY(0) rotate(0) } 10% { opacity: 1 } 100% { opacity: 1; transform: translateY(115vh) rotate(var(--rot)) } }
  .floatup { bottom: -10vh; animation: floatUp var(--d) ease-out forwards; }
  @keyframes floatUp { 0% { opacity: 0; transform: translateY(0) scale(.5) } 15% { opacity: 1 } 100% { opacity: 0; transform: translateY(-115vh) scale(1.2) } }
  .ghost { top: 20vh; left: -20vw; font-size: 15vw; opacity: 1; filter: drop-shadow(0 0 1.4vw var(--accent)); animation: ghostFly 9s linear forwards; }
  @keyframes ghostFly { 0% { transform: translate(0,0) rotate(-6deg) } 25% { transform: translate(35vw,-6vh) rotate(6deg) }
                        50% { transform: translate(70vw,5vh) rotate(-6deg) } 75% { transform: translate(105vw,-5vh) rotate(6deg) } 100% { transform: translate(140vw,0) rotate(-6deg) } }
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="frame"></div>
<div id="fx"></div>
<div id="screen"></div>

<script>
  const PATH_SLUG = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'start');
  const AUTO = PATH_SLUG === 'auto';
  // écran affiché : fixe dans l'URL, ou (mode « auto ») celui qui correspond à la scène OBS en cours
  let SLUG = AUTO ? '' : PATH_SLUG, autoRules = [], obsScene = '';
  const QS = new URLSearchParams(location.search), FORCE = QS.get('screen') || '', SCREENS = ['start', 'brk', 'end'];
  const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
  const NODE = location.protocol + '//' + location.hostname + ':3005';
  const $ = (id) => document.getElementById(id);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const vw = (px) => (px / 19.2) + 'vw';
  const DEF_SIZE = { main: 120, sub: 64, message: 24, plain: 48 };

  let cfg = null, cfgSig = '', theme = {}, offset = 0, serverTarget = null, localTarget = null, ambientTimer = null, tick = null;
  const loadedFonts = new Set();

  function loadFont(name) {
    if (!name || loadedFonts.has(name)) return;
    loadedFonts.add(name);
    const fam = encodeURIComponent(name).replace(/%20/g, '+');
    const add = (spec) => { const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + fam + spec + '&display=swap'; document.head.appendChild(l); return l; };
    // polices à une seule graisse : la demande avec graisses est refusée, on redemande sans
    add(':wght@300;700;900').onerror = () => add('');
  }
  const halloween = () => theme.icon_set === 'halloween' || theme.preset === 'halloween';
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  // texte d'une ligne : retours à la ligne conservés, *mot* mis en couleur d'accent
  function lineHtml(text) {
    return esc(text).replace(/\*([^*\n]+)\*/g, '<span class="em">$1</span>').replace(/\n/g, '<br>');
  }

  // ── décompte ──
  const pad = (n) => String(n).padStart(2, '0');
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    return (h > 0 ? pad(h) + ':' : '') + pad(m) + ':' + pad(r);
  }
  function currentTarget() {
    if (!cfg || !cfg.countdown.enabled) return null;
    if (cfg.countdown.mode === 'time') return serverTarget;
    return serverTarget || localTarget;
  }
  function renderCountdown() {
    const el = $('cd-num'); if (!el || !cfg) return;
    const t = currentTarget(), cd = cfg.countdown;
    if (t == null) { el.textContent = fmt(cd.minutes * 60000); return; }
    const left = t * 1000 - (Date.now() + offset);
    if (left <= 0) { el.textContent = cd.end_text || '00:00'; }
    else { el.textContent = fmt(left); }
  }

  // ── effets d'ambiance ──
  function ambient(effect) {
    clearInterval(ambientTimer); $('fx').innerHTML = '';
    if (!effect || effect === 'none') return;
    const fx = $('fx');
    const mk = (cls, txt, st) => { const d = document.createElement('div'); d.className = 'fx-i ' + cls; d.textContent = txt;
      Object.entries(st).forEach(([k, v]) => d.style.setProperty(k, v)); fx.appendChild(d); setTimeout(() => d.remove(), 12000); };
    const burst = () => {
      if (effect === 'bats') for (let i = 0; i < 6; i++) mk('rise', '🦇', { left: rnd(2, 92) + 'vw', 'font-size': '6vw', '--dx': rnd(-16, 16) + 'vw', '--d': rnd(3, 5) + 's', 'animation-delay': rnd(0, 1.5) + 's' });
      else if (effect === 'confetti') { const b = ['🎃', '🍬', '🍭', '🕷️', '👻', '⭐']; for (let i = 0; i < 8; i++) mk('fall', b[i % b.length], { left: rnd(1, 96) + 'vw', 'font-size': '3vw', '--d': rnd(3, 5) + 's', '--rot': rnd(-360, 360) + 'deg', 'animation-delay': rnd(0, 1.5) + 's' }); }
      else if (effect === 'snow') for (let i = 0; i < 10; i++) mk('fall', '❄', { left: rnd(0, 98) + 'vw', 'font-size': rnd(1.4, 3) + 'vw', color: '#dff3ff', '--d': rnd(4, 7) + 's', '--rot': rnd(-180, 180) + 'deg', 'animation-delay': rnd(0, 2) + 's' });
      else if (effect === 'hearts') for (let i = 0; i < 6; i++) mk('floatup', '❤️', { left: rnd(2, 94) + 'vw', 'font-size': rnd(2.5, 5) + 'vw', '--d': rnd(3, 5) + 's', 'animation-delay': rnd(0, 1.5) + 's' });
      else if (effect === 'ghost') mk('ghost', '👻', {});
    };
    burst();
    ambientTimer = setInterval(burst, effect === 'ghost' ? 14000 : 3500);
  }

  function hexA(hex, a) { const n = parseInt(hex.replace('#', ''), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  // ── rendu ──
  function render() {
    if (!cfg) return;
    const themed = cfg.look === 'theme';
    const accent = cfg.accent || (themed ? theme.w_accent : '') || cfg.base_color || '#ff7a18';
    const base = themed ? (cfg.accent || theme.w_accent || cfg.base_color) : cfg.base_color;
    const outline = cfg.outline;
    const hwOn = !!cfg.halloween_look && halloween();
    const font = cfg.font || ((themed || hwOn) ? theme.w_font : '') || 'Kanit';
    const root = document.documentElement.style;
    root.setProperty('--accent', accent); root.setProperty('--base', base); root.setProperty('--outline', outline);
    root.setProperty('--hue-speed', cfg.hue_speed + 's');
    root.setProperty('--k', cfg.zoom);
    root.setProperty('--frame', cfg.frame_color);
    root.setProperty('--frame-a', hexA(cfg.frame_color, .55)); root.setProperty('--frame-b', hexA(cfg.frame_color, .28));
    const hw = hwOn;
    root.setProperty('--hw1', theme.w_accent || '#ff7a18'); root.setProperty('--hw2', theme.w_accent2 || '#7b2cbf');
    root.setProperty('--font', "'" + font.replace(/'/g, '') + "', sans-serif");
    loadFont(font);
    document.body.className = (themed ? 'look-theme' : 'look-original') + (cfg.hue_rotate ? ' hue' : '') + (cfg.glow ? '' : ' noglow') + (hw ? ' hw' : '') + (cfg.frame ? ' has-frame' : '');

    const bd = $('backdrop');
    bd.style.background = cfg.backdrop === 'none' ? 'transparent'
      : cfg.backdrop === 'dim' ? 'rgba(6,8,18,' + cfg.backdrop_opacity + ')' : hexA(cfg.backdrop_color, cfg.backdrop_opacity);
    ambient(cfg.effect);

    const anim = (cfg.anim_in && cfg.anim_in !== 'none') ? 'in-' + cfg.anim_in + ' ' + cfg.anim_dur + 's ease-out both' : 'none';
    const deco = cfg.halloween_decor && halloween();
    // animation d'entrée d'un élément : la sienne, sinon celle de tout l'écran ; délai + décalage automatique entre lignes
    const animOf = (name, delay) => {
      const a = name || cfg.anim_in;
      if (!a || a === 'none') return 'none';
      return 'in-' + a + ' ' + cfg.anim_dur + 's ease-out ' + delay + 's both';
    };
    const upper = cfg.uppercase ? 'text-transform:uppercase;' : '';
    let firstMain = true, order = 0;
    const free = [];                                   // éléments positionnés librement (lignes, décompte)
    const lines = cfg.lines.map((l, idx) => ({ l, idx })).filter(o => o.l.text.trim() !== '').map(({ l, idx }) => {
      const size = l.size > 0 ? l.size : DEF_SIZE[l.format];
      let st = 'font-size:' + vw(size) + ';margin-bottom:' + vw(cfg.gap) + ';' + upper;
      if (l.color) {
        if (l.format === 'main' && hw) st += 'background-image:linear-gradient(to bottom,color-mix(in srgb,' + l.color + ' 55%,#ffe9b0),' + l.color + ' 45%,color-mix(in srgb,' + l.color + ' 60%,#1b0630));';
        else if (l.format === 'main') st += 'background-image:linear-gradient(' + l.color + ',' + l.color + ');text-shadow:0 0 1px ' + l.color + ';';
        else if (l.format === 'sub') st += '-webkit-text-stroke-color:' + l.color + ';';
        else st += 'color:' + l.color + ';';
      }
      let html = lineHtml(l.text);
      if (deco && l.format === 'main' && firstMain) { html = '🎃 ' + html + ' 🎃'; firstMain = false; }
      const delay = (+l.delay || 0) + order++ * (+cfg.stagger || 0);
      const el = '<div class="ln l-' + l.format + '" data-i="' + idx + '" style="' + st + '">' + html + '</div>';
      if (l.x != null && l.y != null) {              // ligne placée à la main : hors du bloc, à sa position
        free.push('<div class="blk" style="left:' + l.x + '%;top:' + l.y + '%;width:' + (cfg.w / cfg.zoom) + 'vw"><div class="lw" style="animation:' + animOf(l.anim, delay) + '">'
                  + el.replace('margin-bottom:' + vw(cfg.gap) + ';', '') + '</div></div>');
        return '';
      }
      return '<div class="lw" style="animation:' + animOf(l.anim, delay) + '">' + el + '</div>';
    }).join('');

    let cdHtml = '';
    if (cfg.countdown.enabled) {
      const cd = cfg.countdown;
      const inner = '<div class="cd" data-cd="1">' + (cd.label ? '<div class="cd-label" style="font-size:' + vw(Math.max(20, cd.size * 0.32)) + '">' + esc(cd.label) + '</div>' : '')
             + '<div class="cd-num" id="cd-num" style="font-size:' + vw(cd.size) + '"></div></div>';
      const cdDelay = (+cd.delay || 0) + order * (+cfg.stagger || 0);
      if (cd.x != null && cd.y != null) free.push('<div class="blk" style="left:' + cd.x + '%;top:' + cd.y + '%;width:' + (cfg.w / cfg.zoom) + 'vw"><div class="lw" style="animation:' + animOf('', cdDelay) + '">' + inner + '</div></div>');
      else cdHtml = '<div class="lw" style="animation:' + animOf('', cdDelay) + '">' + inner + '</div>';
    }

    let html = '';
    if (cfg.image) html += '<div class="logo" data-img="1" style="animation:' + animOf('', 0) + ';left:' + (cfg.image_x != null ? cfg.image_x : cfg.x) + '%;top:' + cfg.image_y + '%;width:' + cfg.image_w + 'vw"><img src="' + NODE + '/static/commands/images/' + encodeURIComponent(cfg.image) + '" alt=""></div>';
    if (lines || cdHtml) html += '<div class="blk" style="left:' + cfg.x + '%;top:' + cfg.y + '%;width:' + (cfg.w / cfg.zoom) + 'vw"><div class="in' + (cfg.ridge ? ' ridge' : '') + '">' + lines + cdHtml + '</div></div>';
    html += free.join('');
    $('screen').innerHTML = html;
    clearInterval(tick);
    if (cfg.countdown.enabled) { renderCountdown(); tick = setInterval(renderCountdown, 250); }
    if (PREVIEW) { setTimeout(reportRects, 250); setTimeout(reportRects, cfg.anim_dur * 1000 + 400); }
  }

  // L'éditeur dessine ses poignées de déplacement sur la position réelle de chaque élément
  function reportRects() {
    if (!PREVIEW || window.parent === window) return;
    const W = innerWidth, H = innerHeight, r = (el) => { const b = el.getBoundingClientRect();
      return { x: b.left / W * 100, y: b.top / H * 100, w: b.width / W * 100, h: b.height / H * 100 }; };
    const lines = {}; document.querySelectorAll('.ln[data-i]').forEach(el => { lines[el.dataset.i] = r(el); });
    const cd = document.querySelector('[data-cd]'), img = document.querySelector('[data-img]');
    window.parent.postMessage({ type: 'title-rects', lines, countdown: cd ? r(cd) : null, image: img ? r(img) : null }, '*');
  }

  // ── données ──
  function apply(newCfg, cd) {
    if (cd) { offset = (cd.now * 1000) - Date.now(); serverTarget = cd.target; }
    const sig = JSON.stringify(newCfg) + '|' + (theme.w_accent || '') + (theme.w_accent2 || '') + (theme.w_font || '') + (theme.preset || '') + (theme.icon_set || '');
    if (sig === cfgSig) { if (cfg && cfg.countdown.enabled) renderCountdown(); return; }
    cfgSig = sig; cfg = newCfg; render();
  }
  function startLocal() {
    if (cfg && cfg.countdown.enabled && cfg.countdown.mode === 'minutes' && cfg.countdown.auto) {
      localTarget = (Date.now() + offset) / 1000 + cfg.countdown.minutes * 60;
      renderCountdown();
    }
  }
  function pickScreen() {
    if (FORCE && SCREENS.includes(FORCE)) return FORCE;
    const n = obsScene.toLowerCase();
    for (const r of autoRules) if (n && n.includes(String(r.match).toLowerCase())) return r.screen;
    return '';
  }
  function setScene(name, force) {
    if (!name && !force) return;                      // le navigateur OBS renvoie parfois « null » : on garde la dernière scène connue
    obsScene = name || '';
    if (QS.get('debug') === '1') { let d = $('dbg'); if (!d) { d = document.createElement('div'); d.id = 'dbg'; d.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;background:#000c;color:#0f0;font:14px monospace;padding:4px 8px'; document.body.appendChild(d); } d.textContent = 'scène OBS : « ' + obsScene + ' » → écran : ' + (pickScreen() || 'aucun'); }
    const s = pickScreen();
    if (s === SLUG) return;
    SLUG = s; cfg = null; cfgSig = ''; localTarget = null; serverTarget = null;
    clearInterval(tick); clearInterval(ambientTimer); $('screen').innerHTML = ''; $('fx').innerHTML = ''; $('backdrop').style.background = 'transparent';
    if (SLUG) refresh().then(() => startLocal());
  }
  async function refresh() {
    if (AUTO) {
      try { autoRules = (await fetch('/api/titres/auto/rules?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json())).rules || []; } catch (e) {}
      const want = pickScreen();
      if (want !== SLUG) { setScene(obsScene); return; }
    }
    if (!SLUG) return;
    try {
      const [t, th] = await Promise.all([
        fetch('/api/titres/' + encodeURIComponent(SLUG) + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()),
        fetch('/api/labels/style?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()).catch(() => ({})),
      ]);
      theme = th || {};
      const first = !cfg;
      apply(t.config, t.countdown);
      if (first) startLocal();
    } catch (e) { /* on réessaie au prochain tour */ }
  }

  if (PREVIEW) {
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'title-preview') { theme = d.theme || theme; cfgSig = ''; apply(d.config, d.countdown || null); if (d.restart) { localTarget = null; startLocal(); } }
    });
    window.parent.postMessage({ type: 'title-ready' }, '*');
  } else {
    if (AUTO) {
      // la scène OBS en cours : directement (source navigateur), ou relayée par la page « Scène OBS » (le widget est dans un cadre)
      const o = window.obsstudio;
      if (o && o.getCurrentScene) o.getCurrentScene((s) => setScene(s && s.name));
      // source fiable : le serveur lit la scène en cours via obs-websocket (marche aussi après F9 / actualisation des sources)
      const poll = () => fetch('/api/titres/auto/scene?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json())
        .then(j => { if (j && j.scene) setScene(j.scene); }).catch(() => {});
      poll(); setInterval(poll, 1500);
      window.addEventListener('obsSceneChanged', (e) => setScene(e.detail && e.detail.name));
      window.addEventListener('message', (e) => { const d = e.data || {}; if (d.type === 'obs-scene') setScene(d.name); });
      if (QS.get('scene')) obsScene = QS.get('scene');
      try { window.parent.postMessage({ type: 'obs-scene-request' }, '*'); } catch (e) {}
    }
    refresh();
    setInterval(refresh, 8000);
    const again = () => { cfgSig = ''; localTarget = null; refresh().then(() => startLocal()); };
    window.addEventListener('obsSourceVisibleChanged', (e) => { if (e.detail && e.detail.visible) again(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) again(); });
  }
</script>
</body>
</html>
