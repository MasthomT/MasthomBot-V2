<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Scène OBS</title>
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  /* Rien ne doit dépasser du cadre 1920x1080, quelle que soit la taille de la source OBS. */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; contain: paint; }
  /* cadre aura en marge (réglé dans /admin/scene) : sous les widgets */
  #frame { position: absolute; inset: 0; z-index: 0; pointer-events: none; display: none; box-sizing: border-box;
           border: 3px solid var(--frame, #ff7a18);
           box-shadow: inset 0 0 15px 2px var(--frame, #ff7a18), inset 0 0 58px 4px var(--frame-a, #ff7a188c), inset 0 0 154px var(--frame-b, #ff7a1847); }
  .widget {
    position: absolute; width: 1920px; height: 1080px; border: 0;
    background: transparent; transform-origin: 0 0; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"><div id="frame"></div></div>
<script>
  // Cette page ne contient que des cadres transparents ; chaque widget est une page d'overlay existante.
  // Le placement est géré dans /admin/scene et rechargé toutes les 5 s sans toucher aux cadres inchangés.
  // Nom de la scène = dernier segment de l'URL (/overlay/brb -> « brb »)
  const SCENE = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || 'scene');
  const NODE = location.protocol + '//' + location.hostname + ':3005';
  const stage = document.getElementById('stage');
  const frames = new Map(); // key -> { el, sig }
  const $frame = document.getElementById('frame');
  let frameCfg = null;

  function resolveUrl(u) { return u.replace('{NODE}', NODE); }

  function place(el, w) {
    const s = w.scale;
    el.style.left = (w.x - w.nx * s) + 'px';
    el.style.top = (w.y - w.ny * s) + 'px';
    el.style.width = (w.fw || 1920) + 'px';
    el.style.height = (w.fh || 1080) + 'px';
    el.style.transform = 'scale(' + s + ')';
    el.style.zIndex = w.z;
  }

  async function refresh() {
    let layout;
    try {
      const res = await fetch('/api/scene/layout?scene=' + encodeURIComponent(SCENE), { cache: 'no-store' });
      if (!res.ok) return;
      const j = await res.json();
      layout = j.widgets;
      frameCfg = { on: !!j.frame, color: /^#[0-9a-fA-F]{6}$/.test(j.frame_color) ? j.frame_color : '#ff7a18' };
    } catch (e) { return; }

    const fr = $frame;
    if (frameCfg) {
      const c = frameCfg.color, h = (a) => c + Math.round(a * 255).toString(16).padStart(2, '0');
      fr.style.setProperty('--frame', c); fr.style.setProperty('--frame-a', h(.55)); fr.style.setProperty('--frame-b', h(.28));
      fr.style.display = frameCfg.on ? 'block' : 'none';
    }
    const wanted = new Set(layout.map(w => w.key));
    for (const [key, f] of frames) {
      if (!wanted.has(key)) { f.el.remove(); frames.delete(key); }
    }
    for (const w of layout) {
      const url = resolveUrl(w.url);
      let f = frames.get(w.key);
      if (f && f.url !== url) { f.el.remove(); frames.delete(w.key); f = null; }
      if (!f) {
        const el = document.createElement('iframe');
        el.className = 'widget';
        el.setAttribute('allowtransparency', 'true');
        el.setAttribute('scrolling', 'no');
        el.src = url;
        stage.appendChild(el);
        f = { el, url };
        frames.set(w.key, f);
      }
      place(f.el, w);
    }
  }

  // La scène OBS en cours est relayée aux widgets (les événements OBS n'arrivent que dans la page principale,
  // pas dans les cadres) : le widget « Titre automatique » s'en sert pour choisir début / pause / fin.
  let obsScene = '';
  function relay() {
    for (const f of frames.values()) { try { f.el.contentWindow.postMessage({ type: 'obs-scene', name: obsScene }, '*'); } catch (e) {} }
  }
  window.addEventListener('message', (e) => { if (e.data && e.data.type === 'obs-scene-request') relay(); });
  if (window.obsstudio && window.obsstudio.getCurrentScene) {
    window.obsstudio.getCurrentScene((s) => { obsScene = (s && s.name) || ''; relay(); });
  }
  window.addEventListener('obsSceneChanged', (e) => { obsScene = (e.detail && e.detail.name) || ''; relay(); });

  refresh();
  setInterval(refresh, 5000);
  setInterval(relay, 4000);
</script>
</body>
</html>
