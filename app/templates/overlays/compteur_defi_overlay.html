<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: transparent;
  font-family: 'Segoe UI', Arial, sans-serif;
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  width: 520px;
  min-height: 180px;
  overflow: hidden;
}

#panel {
  width: 520px;
  background: linear-gradient(145deg, rgba(10,5,30,0.96), rgba(30,10,60,0.96));
  border: 2px solid rgba(145,70,255,0.6);
  border-radius: 20px;
  padding: 18px 22px 16px;
  box-shadow:
    0 0 40px rgba(145,70,255,0.3),
    0 0 80px rgba(145,70,255,0.1),
    inset 0 0 30px rgba(145,70,255,0.05);
}

/* ── Titre ── */
#titre {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

#titre .label {
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 3px;
  color: #9146ff;
  text-shadow: 0 0 12px rgba(145,70,255,0.8);
}

#countdown {
  font-size: 11px;
  font-weight: 700;
  color: #fbbf24;
  text-shadow: 0 0 10px rgba(251,191,36,0.6);
  letter-spacing: 0.5px;
}

#countdown.urgent {
  color: #f87171;
  text-shadow: 0 0 10px rgba(248,113,113,0.8);
  animation: pulse-red 1s ease infinite;
}

@keyframes pulse-red {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.6; }
}

/* ── Stats ── */
#stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
}

.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.stat-card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  opacity: 0;
  transition: opacity 0.5s;
}

.stat-card.bump::before { animation: bump-glow 0.6s ease forwards; }
@keyframes bump-glow {
  0%   { opacity: 0.8; }
  100% { opacity: 0; }
}

.stat-card:nth-child(1)::before { background: radial-gradient(circle, rgba(99,102,241,0.5), transparent); }
.stat-card:nth-child(2)::before { background: radial-gradient(circle, rgba(236,72,153,0.5), transparent); }
.stat-card:nth-child(3)::before { background: radial-gradient(circle, rgba(251,191,36,0.5), transparent); }

.stat-icon {
  font-size: 20px;
  margin-bottom: 4px;
  display: block;
}

.stat-label {
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 4px;
}

.stat-value {
  font-size: 32px;
  font-weight: 900;
  line-height: 1;
  transition: transform 0.2s ease;
}

.stat-card:nth-child(1) .stat-value { color: #a5b4fc; text-shadow: 0 0 20px rgba(99,102,241,0.6); }
.stat-card:nth-child(2) .stat-value { color: #f9a8d4; text-shadow: 0 0 20px rgba(236,72,153,0.6); }
.stat-card:nth-child(3) .stat-value { color: #fde68a; text-shadow: 0 0 20px rgba(251,191,36,0.6); }

.stat-value.pop { animation: pop-num 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards; }
@keyframes pop-num {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.35); }
  100% { transform: scale(1); }
}

.stat-sub {
  font-size: 9px;
  color: rgba(255,255,255,0.3);
  margin-top: 2px;
}

/* ── Barre de progression ── */
#progress-wrap {
  margin-top: 12px;
  position: relative;
}

#progress-bar-bg {
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 4px;
  overflow: hidden;
}

#progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #9146ff, #ec4899);
  border-radius: 4px;
  transition: width 1s ease;
  box-shadow: 0 0 8px rgba(145,70,255,0.6);
}

#progress-label {
  display: flex;
  justify-content: space-between;
  margin-top: 5px;
  font-size: 8.5px;
  color: rgba(255,255,255,0.3);
  font-weight: 700;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div id="panel">
  <div id="titre">
    <span class="label">⚔️ Défi du Live</span>
    <span id="countdown">Calcul…</span>
  </div>

  <div id="stats">
    <div class="stat-card" id="card-subs">
      <span class="stat-icon">🎯</span>
      <div class="stat-label">Subs</div>
      <div class="stat-value" id="val-subs">—</div>
      <div class="stat-sub" id="sub-subs">&nbsp;</div>
    </div>
    <div class="stat-card" id="card-gifts">
      <span class="stat-icon">🎁</span>
      <div class="stat-label">Subgifts</div>
      <div class="stat-value" id="val-gifts">—</div>
      <div class="stat-sub" id="sub-gifts">&nbsp;</div>
    </div>
    <div class="stat-card" id="card-bits">
      <span class="stat-icon">💎</span>
      <div class="stat-label">Bits</div>
      <div class="stat-value" id="val-bits">—</div>
      <div class="stat-sub" id="sub-bits">&nbsp;</div>
    </div>
  </div>

  <div id="progress-wrap">
    <div id="progress-bar-bg">
      <div id="progress-bar-fill" style="width:0%"></div>
    </div>
    <div id="progress-label">
      <span id="prog-start">06/08</span>
      <span id="prog-pct">0%</span>
      <span id="prog-end">08/08 23:59</span>
    </div>
  </div>
</div>

<script>
// ── Paramètres de la période ──────────────────────────────────────────
const SINCE       = '2026-08-06';            // début du défi
const END_TS      = new Date('2026-08-08T21:59:00Z');  // 08/08 23h59 heure de Paris (UTC+2)
const START_TS    = new Date('2026-08-06T00:00:00+02:00');
const POLL_MS     = 30_000;

// ── État courant ──────────────────────────────────────────────────────
let prev = { subs: -1, subgifts: -1, bits: -1 };

function fmt(n) {
  return n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + 'k' : String(n);
}

function animCard(cardId, valueId, newVal) {
  const card = document.getElementById(cardId);
  const el   = document.getElementById(valueId);
  el.textContent = fmt(newVal);
  el.classList.remove('pop');
  void el.offsetWidth;
  el.classList.add('pop');
  card.classList.remove('bump');
  void card.offsetWidth;
  card.classList.add('bump');
}

function updateStats(data) {
  if (data.subs     !== prev.subs)     animCard('card-subs',  'val-subs',  data.subs);
  if (data.subgifts !== prev.subgifts) animCard('card-gifts', 'val-gifts', data.subgifts);
  if (data.bits     !== prev.bits)     animCard('card-bits',  'val-bits',  data.bits);

  // 1ère initialisation sans animation
  if (prev.subs === -1) {
    document.getElementById('val-subs').textContent  = fmt(data.subs);
    document.getElementById('val-gifts').textContent = fmt(data.subgifts);
    document.getElementById('val-bits').textContent  = fmt(data.bits);
  }

  const total = data.subs + data.subgifts;
  document.getElementById('sub-subs').textContent  = total > 0 ? `+${data.subgifts} gifts` : ' ';
  document.getElementById('sub-gifts').textContent = total > 0 ? `= ${total} total` : ' ';
  document.getElementById('sub-bits').textContent  = data.bits > 0 ? `${(data.bits * 0.014).toFixed(0)} €` : ' ';

  prev = { subs: data.subs, subgifts: data.subgifts, bits: data.bits };
}

async function fetchData() {
  try {
    const r = await fetch(`/api/v1/compteur-defi?since=${SINCE}`);
    if (r.ok) updateStats(await r.json());
  } catch(e) { /* réseau indisponible, on réessaie au prochain poll */ }
}

// ── Compte à rebours ─────────────────────────────────────────────────
function updateCountdown() {
  const now    = Date.now();
  const diff   = END_TS - now;
  const span   = document.getElementById('countdown');

  if (diff <= 0) {
    span.textContent = '⏰ Terminé !';
    span.classList.remove('urgent');

    // Barre à 100%
    document.getElementById('progress-bar-fill').style.width = '100%';
    document.getElementById('prog-pct').textContent = '100%';
    return;
  }

  const h  = Math.floor(diff / 3_600_000);
  const m  = Math.floor((diff % 3_600_000) / 60_000);
  const s  = Math.floor((diff % 60_000) / 1000);

  if (h > 0) {
    span.textContent = `⏳ ${h}h ${String(m).padStart(2,'0')}m`;
  } else if (m > 0) {
    span.textContent = `⏳ ${m}m ${String(s).padStart(2,'0')}s`;
  } else {
    span.textContent = `⏳ ${s}s`;
  }

  span.classList.toggle('urgent', diff < 3_600_000); // rouge dans la dernière heure

  // Barre de progression temporelle
  const total   = END_TS - START_TS;
  const elapsed = now    - START_TS;
  const pct     = Math.min(100, Math.max(0, (elapsed / total) * 100));
  document.getElementById('progress-bar-fill').style.width = pct.toFixed(1) + '%';
  document.getElementById('prog-pct').textContent = pct.toFixed(0) + '%';
}

// ── Boot ──────────────────────────────────────────────────────────────
fetchData();
setInterval(fetchData, POLL_MS);
setInterval(updateCountdown, 1000);
updateCountdown();
</script>
</body>
</html>
