<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Overlays OBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .tab { padding: .6rem 1.1rem; border-radius: .75rem; font-size: .9rem; font-weight: 800; color: #94a3b8; cursor: pointer; border: 1px solid transparent; }
        .tab:hover { background: rgba(51,65,85,.5); color: #fff; }
        .tab.active { background: rgba(99,102,241,.14); color: #818cf8; border-color: rgba(99,102,241,.35); }
        .frame { display: none; width: 100%; border: 0; height: calc(100vh - 150px); min-height: 520px; background: transparent; }
        .frame.active { display: block; }
    </style>
</head>
<body class="font-sans antialiased flex min-h-screen">

    {% include 'admin/sidebar.html' %}

    <main class="flex-1 min-w-0 px-6 md:px-8 pt-6">
        <header class="mb-4 flex flex-wrap items-end justify-between gap-3">
            <div>
                <h1 class="text-3xl font-extrabold text-white tracking-tight">Overlays OBS</h1>
                <p class="text-slate-400 mt-1">Tout ce qui s'affiche dans OBS : la scène et ses widgets, les alertes, les labels et les écrans de titre.</p>
            </div>
            <nav class="flex flex-wrap gap-2" id="tabs">
                <div class="tab" data-tab="scene"><i class="fas fa-layer-group mr-2"></i>Scène OBS</div>
                <div class="tab" data-tab="alerts"><i class="fas fa-ghost mr-2"></i>Alertes</div>
                <div class="tab" data-tab="labels"><i class="fas fa-font mr-2"></i>Labels</div>
                <div class="tab" data-tab="titres"><i class="fas fa-heading mr-2"></i>Titres</div>
            </nav>
        </header>

        <iframe class="frame" id="frame-scene"  data-src="/admin/scene?embed=1"  title="Scène OBS"></iframe>
        <iframe class="frame" id="frame-alerts" data-src="/admin/alerts?embed=1" title="Alertes"></iframe>
        <iframe class="frame" id="frame-labels" data-src="/admin/labels?embed=1" title="Labels"></iframe>
        <iframe class="frame" id="frame-titres" data-src="/admin/titres?embed=1" title="Titres"></iframe>
    </main>

<script>
(function () {
    const names = ['scene', 'alerts', 'labels', 'titres'];
    function show(name) {
        if (!names.includes(name)) name = 'scene';
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
        names.forEach(n => {
            const f = document.getElementById('frame-' + n);
            f.classList.toggle('active', n === name);
            // chargé à la première ouverture, puis gardé : les modifications en cours ne se perdent pas en changeant d'onglet
            if (n === name && !f.getAttribute('src')) f.setAttribute('src', f.dataset.src);
        });
        if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
        try { localStorage.setItem('overlaysHubTab', name); } catch (e) {}
    }
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.tab)));
    let start = location.hash.replace('#', '');
    if (!start) { try { start = localStorage.getItem('overlaysHubTab') || ''; } catch (e) {} }
    show(start || 'scene');
    window.addEventListener('hashchange', () => show(location.hash.replace('#', '')));
})();
</script>
</body>
</html>
